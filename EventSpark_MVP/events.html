<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your Events — EventSpark Workspace</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a class="brand" href="index.html">
        
        <span>Event<span class="brand-spark">Spark</span></span>
      </a>

      <div class="sidebar-nav">
        <small>WORKSPACE</small>
        <a href="dashboard.html">
          <span>▦</span> Overview
        </a>
        <a class="active" href="events.html">
          <span>▣</span> Your Events
        </a>
        <a href="create-event.html">
          <span>＋</span> Create Event
        </a>
        <a href="attendees.html">
          <span>👥</span> Attendees & Check-In
        </a>
        <a href="analytics.html">
          <span>📊</span> Analytics
        </a>

        <small>ACCOUNT</small>
        <a href="settings.html">
          <span>⚙</span> Settings
        </a>
        <button id="logout" class="linkbtn">
          <span>↪</span> Log out
        </button>
      </div>

      <!-- User Profile Widget -->
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebar-avatar">—</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-name">Organizer</div>
          <div class="user-email" id="sidebar-email">organizer@eventspark.io</div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header>
        <div>
          <small>WORKSPACE MANAGEMENT</small>
          <h1>Your Events</h1>
        </div>
        <a class="btn btn-gradient" href="create-event.html">＋ Create Event</a>
      </header>

      <section class="content">
        <!-- Filter Toolbar -->
        <div class="toolbar">
          <input id="search" placeholder="🔍 Search events by title or location..." />
          <select id="filter">
            <option value="all">All statuses</option>
            <option value="published">Published</option>
            <option value="draft">Draft</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <select id="category-filter">
            <option value="all">All categories</option>
            <option value="Technology">Technology</option>
            <option value="Music">Music</option>
            <option value="Workshop">Workshop</option>
            <option value="College fest">College fest</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Events Grid -->
        <div id="event-list" class="cards">
          <p style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--muted);">Loading events...</p>
        </div>
      </section>
    </main>

    <div id="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js?v=3"></script>
    <script src="js/core.js?v=3"></script>
    <script src="js/events.js?v=3"></script>
  </body>
</html>
